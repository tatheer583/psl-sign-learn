name: Rebuild debug APK

# Rebuilds the Android APK whenever the app or its build config changes and
# commits the fresh binary to apk/ so the README download link always points
# at a current build. Ubuntu runners ship the Android SDK with licenses
# accepted; only the JDK is set up here.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-rebuild
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon 2>&1 | tee build.log

      # Workflow logs are only readable by admins, but ::error:: workflow
      # commands become public check annotations we can read from anywhere.
      - name: Emit gradle error tail
        if: failure()
        run: |
          grep -E "error|failure|caused by|what went wrong" -i -A 2 build.log | tail -40 | while IFS= read -r line; do echo "::error::$line"; done

      # The committed file is what the README "Download & install" section
      # links to; keep the same name for a stable link.
      - name: Refresh APK in apk/
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk apk/Irssa-v1.0-debug.apk
          if ! git diff --quiet apk/Irssa-v1.0-debug.apk; then
            git config user.name "irssa-build-bot"
            git config user.email "tatheer583@users.noreply.github.com"
            git add apk/Irssa-v1.0-debug.apk
            git commit -m "Rebuild APK from $(git rev-parse --short HEAD)"
            git push
          else
            echo "APK unchanged — nothing to commit"
          fi
